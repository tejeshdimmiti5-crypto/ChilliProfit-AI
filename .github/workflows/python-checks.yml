name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Compile Python source
        run: python -m compileall backend ml

      - name: Test multi-crop training helpers
        run: python -m pytest -q ml/test_multicrop.py

      - name: Verify FastAPI app imports
        run: python -c "from backend.main import app; print(app.title)"

      - name: Verify ML inference module imports
        run: python -c "from ml.infer import predict_image, load_model; print('ML inference import OK')"

      - name: Verify model bootstrap without URL
        run: python -m backend.fetch_model

      - name: Run API smoke tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/test_main.py
