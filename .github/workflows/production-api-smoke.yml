name: Production API smoke test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml/**"
      - "Dockerfile"
      - "backend/requirements.txt"
      - ".github/workflows/production-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image test dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify live service, model, CORS, and inference
        env:
          API_URL: https://chilliprofit-ai-api.onrender.com
          FRONTEND_ORIGIN: https://chilliprofit-ai-web.onrender.com
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import time
          import urllib.request
          from PIL import Image

          base = os.environ["API_URL"].rstrip("/")
          expected_sha = "b2db895fd43bf801fcc522c3f749fe8f5a9766583cc0e4f336a3553e645bb0ce"
          expected_version = "model-1"

          def request(url, data=None, headers=None, method=None, timeout=30):
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.headers, response.read()

          print(f"Checking production API: {base}")
          last_error = "no response"
          for attempt in range(1, 31):
              try:
                  status_code, _, body = request(f"{base}/health", timeout=20)
                  health = json.loads(body)
                  if status_code == 200 and health.get("status") == "ok":
                      print("PASS: /health")
                      break
                  last_error = f"unexpected response: {health}"
              except Exception as exc:
                  last_error = repr(exc)
              print(f"Waiting for API (attempt {attempt}/30): {last_error}")
              time.sleep(10)
          else:
              raise SystemExit(f"Production API did not become healthy: {last_error}")

          status_code, _, body = request(f"{base}/api/health", timeout=45)
          model_health = json.loads(body)
          assert status_code == 200 and model_health.get("status") == "ok", model_health
          assert model_health.get("model_configured") is True, model_health
          model = model_health.get("model") or {}
          assert model.get("architecture") == "EfficientNet-B0", model_health
          assert model.get("version") == expected_version, model_health
          assert model.get("sha256") == expected_sha, model_health
          assert len(model.get("classes", [])) == 5, model_health
          print("PASS: model identity and five expected classes")
          print("Classes:", ", ".join(model["classes"]))

          origin = os.environ["FRONTEND_ORIGIN"]
          _, cors_headers, _ = request(
              f"{base}/api/analyze",
              data=b"",
              headers={
                  "Origin": origin,
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "content-type",
              },
              method="OPTIONS",
              timeout=30,
          )
          allow_origin = cors_headers.get("Access-Control-Allow-Origin")
          assert allow_origin == origin, f"CORS origin mismatch: {allow_origin}"
          print("PASS: frontend CORS configuration")

          image = Image.new("RGB", (224, 224), (90, 150, 40))
          image_buffer = io.BytesIO()
          image.save(image_buffer, format="JPEG")
          boundary = "----ChilliProfitCIBoundary"
          payload = b"".join([
              f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"smoke.jpg\"\r\nContent-Type: image/jpeg\r\n\r\n".encode(),
              image_buffer.getvalue(),
              f"\r\n--{boundary}\r\nContent-Disposition: form-data; name=\"zone\"\r\n\r\nZone 4\r\n--{boundary}--\r\n".encode(),
          ])
          status_code, _, body = request(
              f"{base}/api/analyze",
              data=payload,
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
              method="POST",
              timeout=90,
          )
          prediction = json.loads(body)
          assert status_code == 200, prediction
          assert prediction.get("status") == "prediction", prediction
          assert prediction.get("confidence") is not None, prediction
          assert isinstance(prediction.get("probabilities"), dict), prediction
          assert prediction.get("zone") == "Zone 4", prediction
          prediction_model = prediction.get("model") or {}
          assert prediction_model.get("version") == expected_version, prediction
          assert prediction_model.get("sha256") == expected_sha, prediction
          print("PASS: synthetic image inference and farm-zone propagation")
          print("Prediction class:", prediction.get("title"))
          print("Confidence:", prediction.get("confidence"))
          print("Zone:", prediction.get("zone"))
          print("All production smoke checks passed.")
          PY
